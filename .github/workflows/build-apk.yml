name: Build Offline APK

on:
  push:
    branches: [ main ]
    paths:
      - '부스운영/오프라인/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Copy web assets into APK
        run: |
          mkdir -p 부스운영/오프라인/rider-apk/app/src/main/assets/www
          cp 부스운영/오프라인/index.html        부스운영/오프라인/rider-apk/app/src/main/assets/www/
          cp 부스운영/오프라인/food.png           부스운영/오프라인/rider-apk/app/src/main/assets/www/
          cp 부스운영/오프라인/og.png             부스운영/오프라인/rider-apk/app/src/main/assets/www/
          cp 부스운영/오프라인/jsQR.js            부스운영/오프라인/rider-apk/app/src/main/assets/www/
          cp 부스운영/오프라인/html5-qrcode.min.js 부스운영/오프라인/rider-apk/app/src/main/assets/www/

      - name: Patch index.html for offline (remove CDN)
        run: |
          sed -i 's|<script src="https://unpkg.com/html5-qrcode[^"]*"></script>|<script src="html5-qrcode.min.js"></script>|g' \
            부스운영/오프라인/rider-apk/app/src/main/assets/www/index.html
          sed -i '/@import url.*fonts.googleapis/d' \
            부스운영/오프라인/rider-apk/app/src/main/assets/www/index.html

      - name: Grant execute permission for gradlew
        working-directory: 부스운영/오프라인/rider-apk
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: 부스운영/오프라인/rider-apk
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baemin-rider-offline
          path: 부스운영/오프라인/rider-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
